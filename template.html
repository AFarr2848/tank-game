<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Tank Game</title>
    <style>
      body {
        margin: 0;
        background-color: #111;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas.emscripten {
        border: 0px none;
        background-color: black;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- The WebGL canvas that GLFW renders into -->
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <!-- Emscripten runtime hook -->
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          return canvas;
        })()
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
